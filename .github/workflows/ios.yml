# Собирает приложение СтройСкан для iPhone на бесплатных Mac-серверах GitHub.
# Результат — StroyScan.ipa без подписи во вкладке Actions → последний запуск → Artifacts.
# На телефон ставится через Sideloadly или AltStore с обычным Apple ID (см. ios/README.md).
name: iOS StroyScan

on:
  workflow_dispatch:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios/StroyScan
    steps:
      - uses: actions/checkout@v6
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app
      - name: Проверка формул материалов
        run: |
          swiftc Sources/ConstructionCalculator.swift Tests/MaterialSmoke.swift -o /tmp/stroyscan-material-tests
          /tmp/stroyscan-material-tests
      - name: Проект Xcode
        run: brew install xcodegen && xcodegen generate
      - name: Сборка
        run: |
          xcodebuild -project StroyScan.xcodeproj -scheme StroyScan -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/StroyScan.app Payload/
          zip -qr StroyScan.ipa Payload
      - uses: actions/upload-artifact@v6
        with:
          name: StroyScan-ipa
          path: ios/StroyScan/StroyScan.ipa
          retention-days: 30
