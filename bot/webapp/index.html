<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>СтройБот</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Палитра «стройплощадка»: бетон, графитовый карандаш, сигнальный жёлтый, синька чертежа */
  :root {
    --concrete: #D9DCDF;   /* фон — бетонная стена */
    --sheet: #F7F8F9;      /* лист сметы */
    --graphite: #1E242B;   /* текст — строительный карандаш */
    --pencil: #6B7580;     /* вторичный текст */
    --rule: #C5CBD1;       /* линейки */
    --signal: #F2C230;     /* сигнальный жёлтый — рулетка, главное действие */
    --blueprint: #1F4E8C;  /* синька — ссылки, отметки */
    --overrun: #C8372D;    /* перерасход, просрочка */
    --done: #2E7D4F;
    --on-signal: #1E242B;
  }
  :root[data-theme="dark"] {
    --concrete: #15191D;
    --sheet: #20252B;
    --graphite: #E9ECEF;
    --pencil: #95A0AB;
    --rule: #343B43;
    --blueprint: #7FA8E0;
    --overrun: #F0685D;
    --done: #5BBF83;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--concrete); color: var(--graphite);
    font: 16px/1.45 "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums; }
  body { padding: 18px 16px calc(28px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--blueprint); outline-offset: 2px; }

  /* типографика: одна гарнитура, контраст за счёт веса и размера */
  .title { font-size: 28px; line-height: 1.1; font-weight: 800; letter-spacing: -.02em; margin: 0; }
  .sub { color: var(--pencil); font-size: 14px; margin-top: 4px; }
  .sum { font-size: 34px; line-height: 1; font-weight: 800; letter-spacing: -.03em; }
  .muted { color: var(--pencil); font-size: 14px; }
  .late { color: var(--overrun); }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  header.top { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 18px; }
  header.top .grow { flex: 1; min-width: 0; }
  .grow { flex: 1; min-width: 0; }

  /* Рулетка — главный визуальный элемент: жёлтая лента с делениями, метка «потрачено» */
  .tape { position: relative; height: 34px; border-radius: 4px; background: var(--signal); overflow: hidden;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); }
  .tape.thin { height: 14px; border-radius: 3px; }
  .tape::before { content: ""; position: absolute; inset: 0; opacity: .55;
    background:
      repeating-linear-gradient(90deg, var(--on-signal) 0 1px, transparent 1px 10%) 0 0 / 100% 45% no-repeat,
      repeating-linear-gradient(90deg, var(--on-signal) 0 1px, transparent 1px 2%) 0 0 / 100% 22% no-repeat; }
  .tape.thin::before { background: repeating-linear-gradient(90deg, var(--on-signal) 0 1px, transparent 1px 10%) 0 0 / 100% 45% no-repeat; }
  .tape .used { position: absolute; left: 0; top: 0; bottom: 0; background: var(--on-signal); opacity: .8;
    transition: width .5s cubic-bezier(.2,.8,.2,1); }
  .tape .mark { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--overrun); }
  .tape.over { background: repeating-linear-gradient(-45deg, var(--signal) 0 12px, var(--on-signal) 12px 24px); }
  .tape.over::before { display: none; }
  .tape.empty { background: var(--rule); }
  .tape.empty::before { opacity: .25; }
  .tape-legend { display: flex; justify-content: space-between; margin-top: 8px; font-size: 14px; color: var(--pencil); }
  .tape-legend b { color: var(--graphite); font-weight: 600; }
  .tape-legend .warn { color: var(--overrun); font-weight: 600; }

  /* Лист — единая подложка для строк, без россыпи одинаковых карточек */
  .sheet { background: var(--sheet); border-radius: 10px; padding: 4px 16px; margin-bottom: 16px; }
  .sheet.pad { padding: 16px; }
  .line { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
  .line:last-child { border-bottom: 0; }
  .line .amount { font-weight: 600; white-space: nowrap; }
  .obj { padding: 16px 0; cursor: pointer; border-bottom: 1px solid var(--rule); }
  .obj:last-child { border-bottom: 0; }
  .obj-head { display: flex; gap: 12px; align-items: baseline; margin-bottom: 10px; }
  .obj-name { font-weight: 600; font-size: 17px; }

  .section { font-size: 15px; font-weight: 600; margin: 22px 2px 8px; }

  /* кнопки */
  .btn { border: 0; border-radius: 8px; padding: 14px 16px; cursor: pointer; font-weight: 600; }
  .btn.primary { background: var(--signal); color: var(--on-signal); }
  .btn.plain { background: var(--sheet); color: var(--graphite); }
  .btn.wide { width: 100%; }
  .btn.round { width: 48px; height: 48px; padding: 0; border-radius: 50%; font-size: 26px; line-height: 1;
    background: var(--signal); color: var(--on-signal); flex: none; }
  .x { border: 0; background: none; color: var(--pencil); padding: 8px; cursor: pointer; font-size: 18px; line-height: 1; }
  .x:hover { color: var(--overrun); }
  .link { border: 0; background: none; color: var(--blueprint); padding: 6px 0; cursor: pointer; font-weight: 500; }
  .danger { color: var(--overrun); }

  /* переключатель вкладок */
  .seg { display: flex; background: var(--sheet); border-radius: 10px; padding: 4px; margin: 18px 0 16px; }
  .seg button { flex: 1; border: 0; background: none; padding: 10px 4px; border-radius: 7px; cursor: pointer;
    color: var(--pencil); font-weight: 500; }
  .seg button[aria-selected="true"] { background: var(--graphite); color: var(--sheet); font-weight: 600; }

  /* формы */
  .field { display: block; margin-bottom: 12px; }
  .field span { display: block; font-size: 14px; color: var(--pencil); margin-bottom: 6px; }
  input { width: 100%; padding: 13px 14px; border-radius: 8px; border: 1.5px solid var(--rule);
    background: var(--concrete); outline: none; }
  input:focus { border-color: var(--blueprint); }
  input.big { font-size: 26px; font-weight: 800; padding: 10px 14px; letter-spacing: -.02em; }
  .chips { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .chips button { flex: 1 1 auto; border: 1.5px solid var(--rule); background: none; border-radius: 20px; padding: 8px 10px;
    cursor: pointer; font-weight: 500; }
  .chips button[aria-pressed="true"] { border-color: var(--graphite); background: var(--graphite); color: var(--sheet); }
  .row { display: flex; gap: 10px; align-items: center; }

  /* этапы — настоящая последовательность, поэтому линия времени */
  .stages { list-style: none; margin: 0; padding: 4px 0; }
  .stage { position: relative; display: flex; gap: 14px; align-items: flex-start; padding: 10px 0 14px; }
  .stage::before { content: ""; position: absolute; left: 13px; top: 38px; bottom: -10px; width: 2px; background: var(--rule); }
  .stage:last-child::before { display: none; }
  .tick { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--pencil); background: var(--sheet);
    cursor: pointer; display: grid; place-items: center; color: #fff; font-size: 15px; padding: 0; transition: transform .15s; }
  .tick:active { transform: scale(.9); }
  .tick[aria-checked="true"] { background: var(--done); border-color: var(--done); }
  .stage.overdue .tick { border-color: var(--overrun); }
  .stage .name { font-weight: 500; }
  .stage.is-done .name { color: var(--pencil); text-decoration: line-through; }

  .kind-dot { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .k-material { background: var(--signal); }
  .k-payment { background: var(--blueprint); }
  .k-other { background: var(--pencil); }

  .empty { padding: 28px 8px; text-align: center; color: var(--pencil); }
  .empty strong { display: block; color: var(--graphite); font-size: 17px; margin-bottom: 6px; }
  .foot { display: flex; gap: 10px; margin-top: 4px; }
  .foot .btn { flex: 1; }
  .balance { text-align: center; color: var(--pencil); font-size: 14px; margin-top: 18px; }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 12px);
    background: var(--graphite); color: var(--sheet); padding: 11px 18px; border-radius: 8px; font-size: 15px;
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .result .line { font-size: 15px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main id="app"><p class="empty">Открываю объекты…</p></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const initData = tg?.initData || "";
const state = { me: null, obj: null, tab: "sum", kind: "material" };
const $app = document.getElementById("app");

// тема: следуем за Telegram, цвета шапки — в тон бетону
function applyTheme() {
  const dark = tg?.colorScheme ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--concrete").trim();
  try { tg?.setHeaderColor?.(bg); tg?.setBackgroundColor?.(bg); } catch {}
}
applyTheme();
tg?.onEvent?.("themeChanged", applyTheme);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => Math.round(n || 0).toLocaleString("ru-RU").replace(/ |,/g, " ") + " ₽";
const fdate = iso => iso ? iso.slice(0, 10).split("-").reverse().join(".") : "";
const today = () => new Date().toISOString().slice(0, 10);
const plural = (n, a, b, c) => { n = Math.abs(n) % 100; if (n > 10 && n < 20) return c; n %= 10; return n === 1 ? a : n > 1 && n < 5 ? b : c; };

function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800);
}
const haptic = (type = "light") => tg?.HapticFeedback?.impactOccurred(type);

async function api(path, opts = {}) {
  const res = await fetch("../api" + path, {
    method: opts.method || "GET",
    headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": initData },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401) throw new Error("auth");
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

function setBack(fn) {
  if (!tg?.BackButton) return;
  if (setBack._fn) tg.BackButton.offClick(setBack._fn);
  setBack._fn = fn;
  if (fn) { tg.BackButton.onClick(fn); tg.BackButton.show(); } else tg.BackButton.hide();
}

// Рулетка: жёлтая лента, тёмная часть — потрачено; при перерасходе — сигнальная штриховка
function tape(spent, budget, thin = false) {
  const cls = "tape" + (thin ? " thin" : "");
  if (!budget) return `<div class="${cls} empty" role="img" aria-label="Бюджет не задан"></div>`;
  if (spent > budget) {
    const at = Math.round(budget / spent * 100);
    return `<div class="${cls} over" role="img" aria-label="Перерасход"><span class="mark" style="left:${at}%"></span></div>`;
  }
  const pct = Math.round(spent / budget * 100);
  return `<div class="${cls}" role="img" aria-label="Потрачено ${pct}% бюджета"><span class="used" style="width:${pct}%"></span></div>`;
}
function legend(spent, budget) {
  if (!budget) return `<div class="tape-legend"><span>Бюджет не задан</span><button class="link" onclick="tab('sum'); setTimeout(() => document.getElementById('e-budget')?.focus(), 50)">Задать</button></div>`;
  if (spent > budget) return `<div class="tape-legend"><span class="warn">Перерасход ${money(spent - budget)}</span><span>бюджет ${money(budget)}</span></div>`;
  return `<div class="tape-legend"><span>Осталось <b>${money(budget - spent)}</b></span><span>из ${money(budget)}</span></div>`;
}

// ---------- маршруты ----------
async function route() {
  const h = location.hash.slice(1);
  try {
    if (h.startsWith("obj/")) return await showObject(+h.split("/")[1]);
    if (h === "new") return showNew();
    if (h === "calc") return await showCalc();
    if (h === "archive") return await showArchive();
    return await showHome();
  } catch (e) {
    $app.innerHTML = e.message === "auth"
      ? `<div class="sheet empty"><strong>Откройте приложение из бота</strong>Так я узнаю, чьи это объекты.</div>`
      : `<div class="sheet empty"><strong>Не удалось загрузить данные</strong>Проверьте интернет и попробуйте ещё раз.<br><br>
         <button class="btn primary" onclick="route()">Обновить</button></div>`;
  }
}
window.addEventListener("hashchange", route);
const go = h => { location.hash = h; };

// ---------- главная ----------
async function showHome() {
  setBack(null);
  state.me = await api("/me");
  const objs = state.me.objects;
  const total = objs.reduce((a, o) => a + o.spent, 0);
  $app.innerHTML = `
    <header class="top">
      <div class="grow">
        <h1 class="title">Мои объекты</h1>
        ${objs.length ? `<div class="sub">${objs.length} ${plural(objs.length, "объект", "объекта", "объектов")}, всего потрачено ${money(total)}</div>` : ""}
      </div>
      <button class="btn round" onclick="go('new')" aria-label="Новый объект">+</button>
    </header>
    ${objs.length ? `<section class="sheet">${objs.map(o => `
      <div class="obj" role="link" tabindex="0" onclick="go('obj/${o.id}')" onkeydown="event.key==='Enter'&&go('obj/${o.id}')">
        <div class="obj-head">
          <div class="grow"><div class="obj-name ellipsis">${esc(o.name)}</div>
            <div class="muted ellipsis">${o.address ? esc(o.address) : (o.stages_total ? `этапов готово: ${o.stages_done} из ${o.stages_total}` : "этапов пока нет")}</div></div>
          <div class="amount ${o.budget && o.spent > o.budget ? "late" : ""}" style="font-weight:600">${money(o.spent)}</div>
        </div>
        ${tape(o.spent, o.budget, true)}
      </div>`).join("")}</section>`
    : `<section class="sheet empty"><strong>Здесь будут ваши объекты</strong>
        Записывайте расходы и выплаты, ставьте сроки этапов — бот напомнит, когда срок подойдёт.<br><br>
        <button class="btn primary" onclick="go('new')">Добавить объект</button></section>`}
    <div class="foot">
      <button class="btn plain" onclick="go('calc')">Калькулятор материалов</button>
      <button class="btn plain" onclick="go('archive')">Архив</button>
    </div>
    <p class="balance">На балансе ${state.me.user.credits} ${plural(state.me.user.credits, "кредит", "кредита", "кредитов")}. Дизайн, сметы и отчёты — в чате бота.</p>`;
}

async function showArchive() {
  setBack(() => go(""));
  const { objects } = await api("/objects/archived");
  $app.innerHTML = `<header class="top"><h1 class="title">Архив</h1></header>` + (objects.length
    ? `<section class="sheet">${objects.map(o => `<div class="obj" onclick="go('obj/${o.id}')">
        <div class="obj-name">${esc(o.name)}</div>${o.address ? `<div class="muted">${esc(o.address)}</div>` : ""}</div>`).join("")}</section>`
    : `<section class="sheet empty"><strong>Архив пуст</strong>Сюда попадают завершённые объекты.</section>`);
}

// ---------- новый объект ----------
function showNew() {
  setBack(() => go(""));
  $app.innerHTML = `
    <header class="top"><h1 class="title">Новый объект</h1></header>
    <form class="sheet pad" id="f-new">
      <label class="field"><span>Название</span><input id="n-name" placeholder="Квартира Ивановых" maxlength="100" required></label>
      <label class="field"><span>Адрес, если нужен</span><input id="n-addr" placeholder="ул. Ленина, 5, кв. 12" maxlength="200"></label>
      <label class="field"><span>Бюджет, ₽</span><input id="n-budget" inputmode="numeric" placeholder="850 000"></label>
      <button class="btn primary wide" id="n-save">Создать объект</button>
    </form>`;
  document.getElementById("n-name").focus();
  document.getElementById("f-new").onsubmit = async e => {
    e.preventDefault();
    const name = document.getElementById("n-name").value.trim();
    if (!name) return toast("Введите название");
    const budget = parseInt(document.getElementById("n-budget").value.replace(/\D/g, "")) || 0;
    const { id } = await api("/objects", { method: "POST",
      body: { name, address: document.getElementById("n-addr").value, budget } });
    haptic("medium"); toast("Объект создан"); go("obj/" + id);
  };
}

// ---------- объект ----------
async function showObject(id) {
  setBack(() => go(""));
  if (state.obj?.object.id !== id) state.tab = "sum";
  state.obj = await api("/objects/" + id);
  renderObject();
}

function renderObject() {
  const { object: o, totals, expenses, stages } = state.obj;
  const kinds = state.me?.expense_kinds || { material: "🧱 Материалы", payment: "💵 Выплаты", other: "📦 Прочее" };
  const label = k => (kinds[k] || "").replace(/^\S+\s/, "");
  const spent = Object.values(totals).reduce((a, b) => a + b, 0);
  const t = state.tab;
  const tabBtn = (k, name) => `<button role="tab" aria-selected="${t === k}" onclick="tab('${k}')">${name}</button>`;
  $app.innerHTML = `
    <header class="top"><div class="grow">
      <h1 class="title ellipsis">${esc(o.name)}</h1>
      ${o.address ? `<div class="sub ellipsis">${esc(o.address)}</div>` : ""}
    </div></header>
    <section>
      <div class="muted">Потрачено</div>
      <div class="sum" style="margin:2px 0 12px">${money(spent)}</div>
      ${tape(spent, o.budget)}
      ${legend(spent, o.budget)}
    </section>
    <nav class="seg" role="tablist">${tabBtn("sum", "Сводка")}${tabBtn("exp", "Расходы")}${tabBtn("stg", "Этапы")}</nav>
    <div id="tab"></div>`;
  const $t = document.getElementById("tab");

  if (t === "sum") {
    const done = stages.filter(s => s.done).length;
    const next = stages.find(s => !s.done);
    $t.innerHTML = `
      <section class="sheet">
        ${Object.keys(kinds).map(k => `<div class="line"><span class="kind-dot k-${k}"></span>
          <div class="grow">${label(k)}</div><span class="amount">${money(totals[k] || 0)}</span></div>`).join("")}
        <div class="line"><div class="grow">Этапы</div><span class="amount">${done} из ${stages.length}</span></div>
        ${next ? `<div class="line"><div class="grow">Следующий этап<div class="muted">${esc(next.name)}</div></div>
          <span class="${next.due && next.due < today() ? "late" : "muted"}">${next.due ? "до " + fdate(next.due) : ""}</span></div>` : ""}
      </section>
      <h2 class="section">Данные объекта</h2>
      <form class="sheet pad" id="f-edit">
        <label class="field"><span>Название</span><input id="e-name" value="${esc(o.name)}" maxlength="100"></label>
        <label class="field"><span>Адрес</span><input id="e-addr" value="${esc(o.address || "")}" maxlength="200"></label>
        <label class="field"><span>Бюджет, ₽</span><input id="e-budget" inputmode="numeric" value="${o.budget || ""}" placeholder="не задан"></label>
        <button class="btn primary wide">Сохранить изменения</button>
      </form>
      <div class="foot">
        <button class="btn plain" onclick="archiveObject(${o.archived ? 0 : 1})">${o.archived ? "Вернуть из архива" : "Убрать в архив"}</button>
        <button class="btn plain danger" onclick="deleteObject()">Удалить</button>
      </div>`;
    document.getElementById("f-edit").onsubmit = e => { e.preventDefault(); saveObject(); };
  }

  if (t === "exp") {
    $t.innerHTML = `
      <form class="sheet pad" id="f-exp">
        <div class="chips" role="group" aria-label="Тип расхода">${Object.keys(kinds).map(k =>
          `<button type="button" aria-pressed="${state.kind === k}" onclick="pickKind('${k}')">${label(k)}</button>`).join("")}</div>
        <div class="row">
          <input id="x-amount" class="big grow" inputmode="decimal" placeholder="0 ₽" aria-label="Сумма">
        </div>
        <input id="x-note" placeholder="За что: плитка, аванс Сергею…" maxlength="200" style="margin:10px 0 12px" aria-label="Комментарий">
        <button class="btn primary wide">Записать расход</button>
      </form>
      ${expenses.length ? `<h2 class="section">Записи</h2><section class="sheet">${expenses.map(e => `
        <div class="line"><span class="kind-dot k-${esc(e.kind)}" title="${esc(label(e.kind))}"></span>
          <div class="grow"><div class="ellipsis">${esc(e.note) || esc(label(e.kind))}</div>
            <div class="muted">${fdate(e.created_at)}</div></div>
          <span class="amount">${money(e.amount)}</span>
          <button class="x" onclick="delExpense(${e.id})" aria-label="Удалить запись">×</button></div>`).join("")}</section>`
      : `<section class="sheet empty"><strong>Расходов пока нет</strong>Запишите первую покупку или выплату — сумма сразу появится на рулетке.</section>`}`;
    document.getElementById("f-exp").onsubmit = e => { e.preventDefault(); addExpense(); };
  }

  if (t === "stg") {
    const now = today();
    $t.innerHTML = `
      <form class="sheet pad" id="f-stage">
        <label class="field"><span>Этап</span><input id="s-name" placeholder="Электрика, плитка в ванной…" maxlength="100"></label>
        <label class="field"><span>Срок, если есть</span><input id="s-due" type="date"></label>
        <button class="btn primary wide">Добавить этап</button>
      </form>
      ${stages.length ? `<section class="sheet"><ol class="stages">${stages.map(s => {
        const overdue = !s.done && s.due && s.due < now;
        return `<li class="stage ${s.done ? "is-done" : ""} ${overdue ? "overdue" : ""}">
          <button class="tick" role="checkbox" aria-checked="${!!s.done}" aria-label="${esc(s.name)}"
            onclick="toggleStage(${s.id}, ${s.done ? 0 : 1})">${s.done ? "✓" : ""}</button>
          <div class="grow"><div class="name">${esc(s.name)}</div>
            ${s.due ? `<div class="${overdue ? "late" : "muted"}">${overdue ? "просрочен с " : "до "}${fdate(s.due)}</div>` : ""}</div>
          <button class="x" onclick="delStage(${s.id})" aria-label="Удалить этап">×</button></li>`;
      }).join("")}</ol></section>`
      : `<section class="sheet empty"><strong>Этапов пока нет</strong>Добавьте этапы со сроками — в день срока бот пришлёт напоминание.</section>`}`;
    document.getElementById("f-stage").onsubmit = e => { e.preventDefault(); addStage(); };
  }
}

window.tab = t => { state.tab = t; renderObject(); };
window.pickKind = k => { state.kind = k; document.querySelectorAll(".chips button").forEach(b =>
  b.setAttribute("aria-pressed", b.getAttribute("onclick").includes(`'${k}'`))); };
const reload = async () => { state.obj = await api("/objects/" + state.obj.object.id); renderObject(); };

window.saveObject = async () => {
  const budget = parseInt(document.getElementById("e-budget").value.replace(/\D/g, "")) || 0;
  await api("/objects/" + state.obj.object.id, { method: "PATCH", body: {
    name: document.getElementById("e-name").value, address: document.getElementById("e-addr").value, budget } });
  haptic(); toast("Изменения сохранены"); reload();
};
window.archiveObject = async v => {
  await api("/objects/" + state.obj.object.id, { method: "PATCH", body: { archived: v } });
  toast(v ? "Объект в архиве" : "Объект вернулся из архива"); go("");
};
window.deleteObject = () => {
  const run = async ok => { if (!ok) return; await api("/objects/" + state.obj.object.id, { method: "DELETE" }); toast("Объект удалён"); go(""); };
  const q = "Удалить объект вместе с расходами и этапами? Это нельзя отменить.";
  tg?.showConfirm ? tg.showConfirm(q, run) : run(confirm(q));
};
window.addExpense = async () => {
  const amount = parseFloat(document.getElementById("x-amount").value.replace(/[\s₽]/g, "").replace(",", "."));
  if (!(amount > 0)) return toast("Введите сумму");
  await api(`/objects/${state.obj.object.id}/expenses`, { method: "POST", body: {
    kind: state.kind, amount, note: document.getElementById("x-note").value } });
  haptic("medium"); toast("Расход записан"); reload();
};
window.delExpense = async id => { await api("/expenses/" + id, { method: "DELETE" }); toast("Запись удалена"); reload(); };
window.addStage = async () => {
  const name = document.getElementById("s-name").value.trim();
  if (!name) return toast("Введите название этапа");
  await api(`/objects/${state.obj.object.id}/stages`, { method: "POST",
    body: { name, due: document.getElementById("s-due").value || null } });
  haptic("medium"); toast("Этап добавлен"); reload();
};
window.toggleStage = async (id, done) => { haptic(); await api("/stages/" + id, { method: "PATCH", body: { done } }); reload(); };
window.delStage = async id => { await api("/stages/" + id, { method: "DELETE" }); toast("Этап удалён"); reload(); };

// ---------- калькулятор ----------
async function showCalc() {
  setBack(() => go(""));
  if (!state.me) state.me = await api("/me");
  const calcs = state.me.calcs;
  const first = Object.keys(calcs)[0];
  $app.innerHTML = `
    <header class="top"><h1 class="title">Калькулятор материалов</h1></header>
    <form class="sheet pad" id="f-calc">
      <div class="chips" role="group" aria-label="Материал">${Object.entries(calcs).map(([k, c]) =>
        `<button type="button" data-k="${k}" aria-pressed="${k === first}">${c.title.replace(/^\S+\s/, "")}</button>`).join("")}</div>
      <p class="muted" id="c-hint" style="margin:0 0 10px"></p>
      <input id="c-nums" inputmode="decimal" placeholder="Числа через пробел" aria-label="Размеры">
      <button class="btn primary wide" id="c-go" style="margin-top:12px">Посчитать</button>
    </form>
    <section class="sheet result" id="c-res" hidden></section>`;
  let key = first;
  const hint = () => { document.getElementById("c-hint").innerHTML = calcs[key].hint; };
  document.querySelectorAll("#f-calc .chips button").forEach(b => b.onclick = () => {
    key = b.dataset.k;
    document.querySelectorAll("#f-calc .chips button").forEach(x => x.setAttribute("aria-pressed", x === b));
    hint(); document.getElementById("c-nums").focus();
  });
  hint();
  document.getElementById("f-calc").onsubmit = async e => {
    e.preventDefault();
    const numbers = document.getElementById("c-nums").value.replace(/,/g, ".").split(/[\s x×х*;\/]+/i)
      .map(parseFloat).filter(n => !isNaN(n));
    try {
      const r = await api("/calc", { method: "POST", body: { key, numbers } });
      const $r = document.getElementById("c-res");
      $r.hidden = false;
      $r.innerHTML = `<div class="line"><b>${esc(r.title)}</b></div>${r.lines.map(l => `<div class="line">${esc(l)}</div>`).join("")}
        <div class="line muted">Расчёт ориентировочный: сверьте с расходом на упаковке.</div>`;
      haptic();
    } catch { toast("Проверьте числа по подсказке"); }
  };
}

route();
</script>
</body>
</html>
