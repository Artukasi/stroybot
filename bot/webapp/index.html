// ---------- замер по скану лидара ----------
function planSvg(s) {
  if (!(s.length && s.width)) return "";
  const W = 320, H = 210, pad = 44;
  const k = Math.min((W - pad * 2) / s.length, (H - pad * 2) / s.width);
  const w = s.length * k, h = s.width * k, x = (W - w) / 2, y = (H - h) / 2;
  const m = v => String(v).replace(".", ",") + " м";
  return `<svg class="plan-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="План: ${m(s.length)} на ${m(s.width)}">
    <rect class="wall" x="${x}" y="${y}" width="${w}" height="${h}" rx="2"/>
    <path class="dim" d="M${x} ${y - 16}H${x + w}M${x} ${y - 22}v12M${x + w} ${y - 22}v12M${x + w + 16} ${y}V${y + h}M${x + w + 10} ${y}h12M${x + w + 10} ${y + h}h12"/>
    <text x="${x + w / 2}" y="${y - 24}" text-anchor="middle">${m(s.length)}</text>
    <text x="${x + w + 24}" y="${y + h / 2 + 4}" transform="rotate(90 ${x + w + 24} ${y + h / 2 + 4})" text-anchor="middle">${m(s.width)}</text>
    ${s.height ? `<text x="${x + w / 2}" y="${y + h / 2 + 5}" text-anchor="middle" style="fill:var(--draft)">h ${m(s.height)}</text>` : ""}</svg>`;
}
// размеры комнаты: план, площади и переходы в калькулятор и смету (для скриншота и для LiDAR-скана)
function showSizes(out, s, plan, objects, scan = null) {
  state.sizes = s;
  const n = v => v ? String(v).replace(".", ",") : "—";
  const calc = (key, nums, name) => nums.every(Boolean) ? `<button type="button" data-calc="${key}" data-nums="${nums.join(" ")}">${name}</button>` : "";
  out.innerHTML = `<section class="panel pad">
    <div class="row"><strong class="grow">${esc(s.room || "Помещение")}</strong><span class="muted">${esc(s.notes || "")}</span></div>
    ${plan?.length > 2 ? polySvg(plan, objects, scan) : planSvg(s)}
    <div class="stats3"><div><b>${n(s.floor_area)}</b><span>пол, м²</span></div><div><b>${n(s.wall_area)}</b><span>стены, м²</span></div><div><b>${n(s.perimeter)}</b><span>периметр, м</span></div></div>
    <p class="muted" style="margin:0 0 8px">Посчитать материалы</p>
    <div class="chips wrap">${calc("tile", [s.floor_area, 30, 60], "Плитка на пол")}${calc("laminate", [s.floor_area], "Ламинат")}
      ${calc("wallpaper", [s.perimeter, s.height], "Обои")}${calc("paint", [s.wall_area, 2], "Краска")}${calc("plaster", [s.wall_area, 10], "Штукатурка")}</div>
    ${scan ? "" : `<button class="btn" data-est>Смета по этим размерам</button>`}</section>`;
  out.querySelectorAll("[data-calc]").forEach(b => b.onclick = () => { state.calcPrefill = { key: b.dataset.calc, nums: b.dataset.nums }; go("calc"); });
  if (scan) return;   // у скана своя смета: по точным объёмам и выбранному ремонту
  out.querySelector("[data-est]").onclick = () => {
    const parts = [s.room || "Помещение", s.length && s.width ? `${n(s.length)} × ${n(s.width)} м` : "", s.height ? `высота ${n(s.height)} м` : "",
      s.floor_area ? `пол ${n(s.floor_area)} м²` : "", s.wall_area ? `стены ${n(s.wall_area)} м²` : ""].filter(Boolean);
    state.prefill = { kind: "estimate", text: parts.join(", ") + ". Работы: " }; go("t/estimate");
  };
}
// контур комнаты обходом стен (plan.js, общий с 3D): план из скана бывает выпуклой оболочкой и накрывает выемку Г-образной комнаты
const PLAN_URL = location.pathname.replace(/\/?$/, "/") + "plan.js";
let PLAN = null;
const loadPlan = () => PLAN ? Promise.resolve(PLAN) : import(PLAN_URL).then(m => (PLAN = m)).catch(() => null);
// план по точкам из LiDAR-скана: стены с длинами; у сканов v2 — окна, двери и то, что нужно доснять
function polySvg(pts, objects = [], scan = null) {
  const lines = scan?.wall_lines || [], ol = scan && PLAN ? PLAN.outlineOf(scan) : null;
  if (ol) pts = ol.poly;
  const all = pts.concat(lines.flatMap(l => [[l[0], l[1]], [l[2], l[3]]]));
  const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  const minX = Math.min(...xs), minY = Math.min(...ys), w = Math.max(...xs) - minX || 1, h = Math.max(...ys) - minY || 1;
  const W = 320, H = 220, pad = 40, k = Math.min((W - pad * 2) / w, (H - pad * 2) / h);
  const ox = (W - w * k) / 2, oy = (H - h * k) / 2;
  const T = ([x, y]) => [ox + (x - minX) * k, oy + (y - minY) * k], F = p => p.map(v => v.toFixed(1)).join(" ");
  const P = pts.map(T);
  let area = 0;   // знак — в какую сторону обход: подписи длин ставим снаружи стены
  P.forEach(([x1, y1], i) => { const [x2, y2] = P[(i + 1) % P.length]; area += x1 * y2 - x2 * y1; });
  const labels = P.map((p, i) => {
    const q = P[(i + 1) % P.length], len = Math.hypot(pts[(i + 1) % pts.length][0] - pts[i][0], pts[(i + 1) % pts.length][1] - pts[i][1]);
    if (len < .4) return "";
    let mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
    const ex = q[0] - p[0], ey = q[1] - p[1], d = Math.hypot(ex, ey) || 1, s = area > 0 ? 1 : -1;
    mx += ey / d * 16 * s; my += -ex / d * 16 * s + 4;
    return `<text x="${mx.toFixed(1)}" y="${my.toFixed(1)}" text-anchor="middle">${len.toFixed(2).replace(".", ",")}</text>`;
  }).join("");
  // мебель из скана: повёрнутые прямоугольники в тех же координатах, что и стены
  const furn = objects.filter(o => o.width && o.depth).map(o => {
    const x = ox + (o.x - minX) * k, y = oy + (o.y - minY) * k, fw = o.width * k, fd = o.depth * k;
    return `<rect class="furn" x="${(-fw / 2).toFixed(1)}" y="${(-fd / 2).toFixed(1)}" width="${fw.toFixed(1)}" height="${fd.toFixed(1)}" rx="2"
      transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${((o.angle || 0) * 180 / Math.PI).toFixed(1)})"/>`;
  }).join("");
  let extra = "";
  if (lines.length) {
    const inside = (x, y) => { let r = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const [x1, y1] = pts[i], [x2, y2] = pts[j]; if ((y1 > y) !== (y2 > y) && x < (x2 - x1) * (y - y1) / (y2 - y1) + x1) r = !r; } return r; };
    const wall = i => { const [x1, y1, x2, y2] = lines[i], len = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / len, uy = (y2 - y1) / len;
      let nx = -uy, ny = ux;   // нормаль внутрь комнаты: по обходу стен, без него — по контуру
      if (ol ? !ol.left[i] : !inside((x1 + x2) / 2 + nx * .1, (y1 + y2) / 2 + ny * .1)) { nx = -nx; ny = -ny; }
      return { x1, y1, len, ux, uy, nx, ny, at: (s, n = 0) => T([x1 + ux * s + nx * n, y1 + uy * s + ny * n]) }; };
    for (const o of scan.openings || []) {
      if (!lines[o.wall] || o.offset == null || !o.width) continue;
      const L = wall(o.wall), a = Math.max(0, o.offset - o.width / 2), b = Math.min(L.len, o.offset + o.width / 2);
      const A = L.at(a), B = L.at(b);
      if (o.kind === "window") { extra += `<path class="op-win" d="M${F(A)}L${F(B)}"/><path class="op-win-i" d="M${F(A)}L${F(B)}"/>`; continue; }
      extra += `<path class="op-gap" d="M${F(A)}L${F(B)}"/>`;
      if (o.kind === "door") {   // дверь открывается в комнату: полотно и дуга
        const C = L.at(a, b - a), r = ((b - a) * k).toFixed(1), sweep = (C[0] - A[0]) * (B[1] - A[1]) - (C[1] - A[1]) * (B[0] - A[0]) > 0 ? 1 : 0;
        extra += `<path class="op-door" d="M${F(A)}L${F(C)}A${r} ${r} 0 0 ${sweep} ${F(B)}"/>`;
      }
    }
    const weak = weakWalls(scan);
    for (const i of weak) {
      const L = wall(i), A = L.at(0), B = L.at(L.len), M = L.at(L.len / 2, 16 / k);   // номер — внутри, снаружи подписи длин
      extra += `<path class="weak" d="M${F(A)}L${F(B)}"/><g class="badge"><circle cx="${M[0].toFixed(1)}" cy="${M[1].toFixed(1)}" r="9"/>
        <text x="${M[0].toFixed(1)}" y="${(M[1] + 4).toFixed(1)}" text-anchor="middle">${i + 1}</text></g>`;
    }
    for (const [g, d] of wallGaps(lines)) { const [x, y] = T(g); extra += `<circle class="gap" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${Math.max(8, d * k / 2 + 5).toFixed(1)}"/>`; }
  }
  return `<svg class="plan-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="План комнаты по скану">
    <path class="wall" d="M${P.map(F).join("L")}Z"/>${furn}${extra}${labels}</svg>`;
}
// номера стен из подсказок приложения: «Стена 2 (справа на плане)…», «Угол между стенами 4 и 5…»
function weakWalls(scan) {
  const out = new Set(), n = (scan?.wall_lines || []).length;
  for (const t of scan?.quality?.issues || []) for (const m of t.matchAll(/стен\S*\s+(\d+)(?:\s+и\s+(\d+))?/gi))
    [m[1], m[2]].forEach(v => { if (v && +v >= 1 && +v <= n) out.add(+v - 1); });
  return out;
}
// концы стен, которые ни во что не упёрлись: недоснятый угол → [середина щели, её ширина]
function wallGaps(lines) {
  const dist = ([px, py], [x1, y1, x2, y2]) => {
    const dx = x2 - x1, dy = y2 - y1, t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / (dx * dx + dy * dy || 1)));
    return Math.hypot(px - x1 - dx * t, py - y1 - dy * t);
  };
  const ends = [], out = [], used = new Set();
  lines.forEach((l, i) => [[l[0], l[1]], [l[2], l[3]]].forEach(p => { if (lines.length > 1 && lines.every((m, j) => j === i || dist(p, m) > .3)) ends.push({ p, i }); }));
  const d = (a, b) => Math.hypot(a.p[0] - b.p[0], a.p[1] - b.p[1]);
  for (const a of ends) {   // два конца рядом — одна щель
    if (used.has(a)) continue;
    const b = ends.filter(e => e.i !== a.i && !used.has(e) && d(a, e) < 1.5).sort((e, f) => d(a, e) - d(a, f))[0];
    used.add(a);
    if (b) { used.add(b); out.push([[(a.p[0] + b.p[0]) / 2, (a.p[1] + b.p[1]) / 2], d(a, b)]); } else out.push([a.p, 0]);
  }
  return out;
}

const openUrl = u => tg?.openLink ? tg.openLink(u) : open(u, "_blank");
const cmPair = (a, b) => a && b ? `${a} × ${b} см` : a ? `${a} см` : "";
function furnItem(f, { place = false, bare = false } = {}) {
  const now = cmPair(f.size?.width, f.size?.depth), max = cmPair(f.max?.width, f.max?.depth);
  return `<div class="fitem">
    ${bare ? "" : `<div class="row"><b class="grow">${esc(f.title)}${f.n > 1 ? ` ×${f.n}` : ""}</b>${f.place ? `<span class="tag-s">совет</span>` : now ? `<span class="muted">сейчас ${now}</span>` : ""}</div>`}
    ${max ? `<div class="fit">Влезет до <b>${max}</b></div>` : ""}
    <div class="muted">${esc(f.note)}</div>
    <div class="shops">${(f.links || []).map(l => `<button type="button" data-url="${esc(l.url)}" aria-label="Искать: ${esc(l.shop)}">${esc(l.shop.replace("Яндекс ", ""))}</button>`).join("")}</div>
    ${place && f.place ? `<button type="button" class="btn quiet" style="margin-top:8px" data-place>Поставить в 3D</button>` : ""}</div>`;
}
function wireShops(root) {
  root.querySelectorAll("[data-url]").forEach(b => b.onclick = () => { haptic(); openUrl(b.dataset.url); });
}
async function furnitureList(x, out) {
  out.innerHTML = drafting(["Меряю свободные стены…", "Оставляю проходы 70 см…", "Ищу в магазинах…"], "");
  rotateMsgs(out);
  let items;
  try { ({ items } = await api(`/scans/${x.id}/furniture`)); }
  catch (e) { clearScreen(); out.innerHTML = ""; out.parentNode.querySelector("[data-furn]").hidden = false; return aiError(e); }
  clearScreen();
  // одинаковые вещи (стулья у стола) — одной строкой; «влезет» — по самой зажатой
  const list = [];
  for (const f of items) {
    const same = !f.place && list.find(g => !g.place && g.kind === f.kind && g.title === f.title && g.query === f.query);
    if (!same) { list.push({ ...f, max: { ...f.max }, n: 1 }); continue; }
    same.n++;
    for (const k of ["width", "depth"]) if (f.max?.[k] != null) same.max[k] = Math.min(same.max[k] ?? f.max[k], f.max[k]);
  }
  const SHOW = 5;
  out.innerHTML = list.length
    ? `<p class="muted" style="margin:0">Размеры: ширина × глубина. Больше не ставьте — не пройти или не открыть дверь</p>
      ${list.map((f, k) => `<div data-k="${k}" ${k >= SHOW ? "hidden" : ""}>${furnItem(f, { place: true })}</div>`).join("")}
      ${list.length > SHOW ? `<button type="button" class="btn quiet" data-all>Показать ещё ${list.length - SHOW}</button>` : ""}`
    : `<p class="muted" style="margin:0">В скане нет мебели. Добавьте её в 3D, и я подскажу размеры</p>`;
  wireShops(out);
  out.querySelector("[data-all]")?.addEventListener("click", e => { haptic(); out.querySelectorAll("[data-k][hidden]").forEach(d => { d.hidden = false; }); e.target.remove(); });
  out.querySelectorAll("[data-place]").forEach(b => b.onclick = () => { haptic(); open3D(x, { add: list[+b.closest("[data-k]").dataset.k] }); });
}

// ---------- ремонт в 3D: комната в точных размерах, правки, фото «как в жизни» ----------
const R3D_URL = location.pathname.replace(/\/?$/, "/") + "room3d.js";
let R3D = null;   // модуль 3D: грузим, только когда открыли
async function open3D(x, { add = null } = {}) {
  if (document.querySelector(".r3d")) return;
  const p = await loadProfile(), issues = x.quality?.issues || [];
  const price = p.prices.design, credits = n => `${n} ${plural(n, "кредит", "кредита", "кредитов")}`;
  const el = document.createElement("div");
  el.className = "r3d"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Ремонт в 3D");
  el.innerHTML = `
    <div class="r3d-top">
      <div class="r3d-head"><b class="grow ellipsis">${esc(x.room)} в 3D</b><span class="muted" data-save aria-live="polite"></span>
        <button class="x" data-close aria-label="Закрыть 3D">×</button></div>
      <nav class="seg two" role="tablist" aria-label="Вид"><span class="ind"></span>
        <button role="tab" aria-selected="true" data-mode="orbit">Сверху</button><button role="tab" aria-selected="false" data-mode="room">Из комнаты</button></nav>
      <div class="stylebar" role="group" aria-label="Стиль">${Object.entries(p.styles).map(([k, t]) => `<button type="button" data-k="${k}" aria-pressed="false">${esc(t)}</button>`).join("")}</div>
    </div>
    <div class="r3d-stage"><canvas tabindex="0" aria-label="3D-модель комнаты. Крутите пальцем, нажмите на предмет, чтобы поменять"></canvas>
      ${drafting(["Строю комнату по скану…", "Кладу пол и обои…", "Ставлю мебель…", "Включаю свет…"], "")}
      <button type="button" class="r3d-pill l" data-add hidden>＋ Мебель</button>
      <button type="button" class="r3d-pill r" data-pr hidden></button>
      <div class="r3d-hint gone"></div></div>
    <div class="r3d-bar"><button class="btn quiet" data-finish disabled>Отделка</button>
      <button class="btn" data-real disabled>Как в жизни<small><span class="wide">фото ремонта · </span>${credits(price)}</small></button></div>`;
  document.body.append(el);
  const $ = s => el.querySelector(s), stage = $(".r3d-stage"), status = $("[data-save]"), hint = $(".r3d-hint");
  const prevBack = setBack._fn;
  let E = null, saveT = 0, saving = null, closed = false, busy = false, shops = null, open = null, hintT = 0;
  const close = () => {
    if (closed) return;
    closed = true; flush();
    clearTimeout(hintT); E?.dispose(); el.remove();
    const i = overlays.indexOf(close); if (i >= 0) overlays.splice(i, 1);
    setBack(prevBack);
    // список мебели на странице скана мог устареть: убранное и добавленное в 3D
    const fout = document.querySelector("#sc-furn [data-fout]");
    if (fout?.innerHTML && hashPath() === "scan/" + x.id) saving ? saving.then(() => furnitureList(x, fout)) : furnitureList(x, fout);
  };
  overlays.push(close);
  const back = () => { const res = $(".r3d-res"); if (res) res.remove(); else if (open) closeSheet(); else close(); };
  setBack(back);
  $("[data-close]").onclick = close;

  // загружаем three.js и строим комнату (на слабом телефоне — пара секунд)
  rotateMsgs(stage);
  try { R3D = R3D || await import(R3D_URL); }
  catch { if (!closed) { toast("Не загрузилось 3D. Проверьте интернет"); close(); } return; }
  await new Promise(r => requestAnimationFrame(() => setTimeout(r, 30)));
  if (closed) return;
  try { E = R3D.createRoom3D({ canvas: $("canvas"), scan: x, look: x.look, reduced, onPick: picked, onChange: changed }); } catch { E = null; }
  clearScreen(); $(".drafting")?.remove();
  if (!E) { toast("Этот телефон не показывает 3D. Попробуйте «Ремонт на картинке»", 3200); return close(); }
  const M = R3D;
  el.querySelectorAll("[data-finish], [data-real]").forEach(b => { b.disabled = false; });
  $("[data-add]").hidden = false;

  // подсказка внизу: что можно делать; гаснет сама и от первого касания
  const say = (t, ms = 6000) => { hint.textContent = t; hint.classList.remove("gone"); clearTimeout(hintT); hintT = setTimeout(() => hint.classList.add("gone"), ms); };
  say("Крутите пальцем, двумя — приближайте. Нажмите на мебель, стену или пол, чтобы поменять", 7000);
  $("canvas").addEventListener("pointerdown", () => { clearTimeout(hintT); hintT = setTimeout(() => hint.classList.add("gone"), 600); });

  // стиль: отделка и свет из стиля, выбранная мебель остаётся
  const syncStyle = () => el.querySelectorAll(".stylebar button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === E.look.style));
  syncStyle();
  $(".stylebar").onclick = e => {
    const b = e.target.closest("[data-k]");
    if (!b || b.dataset.k === E.look.style) return;
    haptic(); closeSheet();
    E.update(l => M.withStyle(l, b.dataset.k)); syncStyle();
    b.scrollIntoView({ inline: "nearest", block: "nearest", behavior: reduced ? "auto" : "smooth" });
  };

  // вид: сверху (кукольный домик) или из комнаты, на высоте глаз
  const seg = $(".seg"), pr = $("[data-pr]");
  const pills = m => {
    pr.hidden = m !== "room" && !issues.length;
    pr.className = "r3d-pill r" + (m === "room" ? "" : " warn");
    pr.textContent = m === "room" ? "Другой угол ↻" : `⚠ Доснять: ${issues.length}`;
  };
  const setMode = async m => {
    seg.querySelector(".ind").style.transform = `translateX(${m === "room" ? 100 : 0}%)`;
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", b.dataset.mode === m));
    pills(m);
    if (m === "room") say("Ведите пальцем, чтобы осмотреться. «Другой угол» — встать в другое место", 4500);
    await E.setMode(m);
  };

  seg.onclick = e => { const b = e.target.closest("[data-mode]"); if (b && b.dataset.mode !== E.mode) { haptic(); setMode(b.dataset.mode); } };

  $("[data-add]").onclick = () => { haptic(); sheet("add"); };

  // ---------- сохранение: через секунду после последней правки ----------

    shops = null;
    clearTimeout(saveT); saveT = setTimeout(save, 900);
  }
  function save() {
    saveT = 0;
    const look = M.toContract(E.look);
    saving = api(`/scans/${x.id}/look`, { method: "PUT", body: { look } })
      .then(() => { x.look = look; if (!saveT && !closed) { status.textContent = "Сохранено"; status.classList.add("ok"); } })
      .catch(() => { if (!closed) { status.textContent = "Не сохранилось"; toast("Не сохранилось, проверьте интернет"); } })
      .finally(() => { saving = null; if (!saveT) while (waiters.length) waiters.pop()(); });
    return saving;
  }
  function flush() { if (saveT) { clearTimeout(saveT); return save(); } return saving || Promise.resolve(); }

  const waiters = [];

  // ---------- нижний лист с выбором ----------
  const chips = (f, list, val) => `<div class="chips" role="group" data-f="${f}">${list.map(([k, t]) => `<button type="button" data-v="${k}" aria-pressed="${k === val}">${esc(t)}</button>`).join("")}</div>`;
  const swatches = (f, list, val) => `<div class="sw-row" role="group" data-f="${f}">${[...new Set([...list, val])].map(c =>
    `<button type="button" class="swatch" data-v="${c}" style="background:${c}" aria-pressed="${c === val}" aria-label="Цвет ${c}"></button>`).join("")}</div>`;
  const head = (title, sub = "") => `<div class="sh-head"><div class="grow"><strong>${esc(title)}</strong>${sub ? `<div class="muted">${esc(sub)}</div>` : ""}</div>
    <button type="button" class="x" data-close aria-label="Закрыть">×</button></div>`;
  const label = (list, k) => (list.find(v => v[0] === k) || [, ""])[1];
  const cm = v => Math.round(v * 100);
  function closeSheet() {

      const size = `${cm(s.width)} × ${cm(s.depth)} × ${cm(s.height)} см`;
      html = head(title, s.hidden ? "Убрано из комнаты" : s.added ? `${size}. Двигайте пальцем по полу` : `${size}, как в скане`)
        + (s.hidden ? "" : (vs ? `<div class="sh-l">Какой</div>${chips("variant", vs, s.variant)}` : "")
          + `<div class="sh-l">Цвет</div>${swatches("color", M.colorsFor(s.kind, s.variant), s.color)}`)
        + `<div class="pair" style="margin-top:16px">${s.added
          ? `<button type="button" class="btn quiet" data-act="rotate">Повернуть</button><button type="button" class="btn quiet danger" data-act="del">Удалить</button>`
          : s.hidden ? `<button type="button" class="btn" data-act="show" style="grid-column:1/-1">Вернуть на место</button>`
          : `<button type="button" class="btn quiet" data-act="hide" style="grid-column:1/-1">Убрать из комнаты</button>`}</div>`
        + (s.hidden || ["stairs", "fireplace", "object"].includes(s.kind) ? "" : `<div class="sh-l">Где купить такой размер</div><div data-shops><p class="muted" style="margin:0">Ищу…</p></div>`);
      const set = fn => E.update(l => {
        if (s.added) fn(l.added[s.j]);
        else { const o = l.objects[s.i] = { ...(l.objects[s.i] || {}) }; fn(o); if (!Object.keys(o).length) delete l.objects[s.i]; }
      });
      act = {
        variant: v => set(o => {
          o.variant = v;
          const pal = M.STYLES[L.style].pal;
          if (!M.colorsFor(s.kind, v).includes(o.color || s.color)) { if (s.added) o.color = M.defaultColor(s.kind, v, pal); else delete o.color; }
          if (s.added) [o.width, o.depth, o.height] = M.sizeOf(s.kind, v);
        }),

        + (can ? chips("scope", [["all", "Все стены"], ["one", "Только эта"]], one ? "one" : "all") : "")
        + `<div class="sh-l">Отделка</div>${chips("finish", M.WALL_FINISHES, w.finish)}`
        + (w.finish === "wallpaper" ? `<div class="sh-l">Узор</div>${chips("pattern", M.PATTERNS, w.pattern)}` : "")
        + `<div class="sh-l">Цвет</div>${swatches("color", M.COLORS.wall, w.color)}`;
      const set = (k, v) => E.update(l => { (one ? l.accent : l.wall)[k] = v; });
      act = {
        scope: v => E.update(l => { l.accent = v === "one" ? { wall: sel.i, ...l.wall } : null; }),
        finish: v => set("finish", v), pattern: v => set("pattern", v), color: v => set("color", v),
      };
    } else if (kind === "floor") {
      html = head("Пол", "Вся комната") + `<div class="sh-l">Покрытие</div>${chips("finish", M.FLOORS, L.floor.finish)}`
        + `<div class="sh-l">Цвет</div>${swatches("color", L.floor.finish === "carpet" ? M.COLORS.fabric : M.COLORS.floor, L.floor.color)}`;
      act = { finish: v => E.update(l => { l.floor.finish = v; }), color: v => E.update(l => { l.floor.color = v; }) };
    } else if (kind === "ceiling") {
      html = head("Потолок и свет", "Светильник светит по-настоящему") + `<div class="sh-l">Свет</div>${chips("light", M.LIGHTS, L.ceiling.light)}`
        + `<div class="sh-l">Цвет потолка</div>${swatches("color", M.COLORS.ceiling, L.ceiling.color)}`;
      act = { light: v => E.update(l => { l.ceiling.light = v; }), color: v => E.update(l => { l.ceiling.color = v; }) };
    } else if (kind === "window") {
      html = head("Окна", "Для всех окон комнаты") + `<div class="sh-l">Шторы</div>${chips("curtains", M.CURTAINS, L.curtains)}`;
      act = { curtains: v => E.update(l => { l.curtains = v; }) };
    } else if (kind === "add") {
      html = head("Добавить мебель", "В обычном размере, на свободное место")
        + `<div class="add-grid">${M.ADDABLE.map(([k, v, t], n) => { const [w, d] = M.sizeOf(k, v); return `<button type="button" data-n="${n}"><b>${esc(t)}</b><span>${cm(w)} × ${cm(d)} см</span></button>`; }).join("")}</div>`;
    } else if (kind === "finish") {
      const row = (go, color, title, sub) => `<div class="line" role="button" tabindex="0" data-go="${go}" style="cursor:pointer">
        <span class="dot" style="background:${color || "transparent"}"></span><div class="grow"><b>${title}</b><div class="muted">${esc(sub)}</div></div><span class="muted" aria-hidden="true">›</span></div>`;
      html = head("Отделка", "Или нажмите на стену, пол или люстру в 3D")
        + row("wall", L.wall.color, "Стены", label(M.WALL_FINISHES, L.wall.finish) + (L.accent ? ", одна стена другая" : ""))
        + row("floor", L.floor.color, "Пол", label(M.FLOORS, L.floor.finish))
        + row("ceiling", L.ceiling.color, "Потолок и свет", label(M.LIGHTS, L.ceiling.light))
        + row("window", L.curtains === "none" ? "" : M.STYLES[L.style].pal.curtain, "Окна", label(M.CURTAINS, L.curtains))
        + `<button type="button" class="btn quiet" style="margin-top:12px" data-go="add">＋ Добавить мебель</button>`;
    } else if (kind === "issues") {
      html = head("Нужно доснять", "Так пишет СтройСкан") + `<ul>${issues.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
        <p class="muted" style="margin:0">Пересканируйте эти места в приложении. Ремонт можно собирать уже сейчас — новый скан уточнит размеры</p>`;
    }
    old?.remove();
    const sh = document.createElement("div");
    sh.className = "r3d-sheet"; sh.setAttribute("role", "dialog"); sh.setAttribute("aria-label", "Выбор");
    if (keep) sh.style.animation = "none";
    sh.innerHTML = `<div class="grab"></div>${html}`;
    stage.append(sh);
    sh.scrollTop = top;
    open = { kind, sel };
    hint.classList.add("gone");
    if (!keep) {
      if (["floor", "ceiling"].includes(kind)) E.select({ type: kind });
      else if (!["obj", "wall", "window"].includes(kind)) E.select(null);
    }
    E.setInset(Math.min(sh.offsetHeight, stage.clientHeight * .56));
    sh.querySelector("[data-close]").onclick = closeSheet;
    sh.onclick = e => {
      const b = e.target.closest("button, [data-go]");
      if (!b || b.matches("[data-close]")) return;
      const f = b.closest("[data-f]")?.dataset.f;
      if (f && act[f]) { haptic(); if (!act[f](b.dataset.v)) sheet(kind, sel, true); return; }
      if (b.dataset.act && act[b.dataset.act]) { haptic(); if (!act[b.dataset.act]()) sheet(kind, sel, true); return; }
      if (b.dataset.go) { haptic(); sheet(b.dataset.go, b.dataset.go === "wall" ? { type: "wall", i: null } : b.dataset.go === "window" ? { type: "window" } : null); return; }
      if (b.dataset.n) {   // добавить мебель
        const [k, v, t] = M.ADDABLE[+b.dataset.n], r = E.add(k, v);
        if (!r) return toast(`Больше ${M.MAX_ADDED} вещей добавить нельзя`);
        notify("success");
        const s2 = { type: "added", j: r.j };
        E.select(s2); sheet("obj", s2);
        toast(r.tight ? "Места мало — поставил в центр, передвиньте пальцем" : `${t}: двигайте пальцем по полу`, 2600);
      }
    };
    // смахнуть лист вниз за шапку — закрыть; лист едет за пальцем. Считаем только палец, которым начали
    let swipe = null;
    const settle = () => { if (!swipe) return; swipe = null; sh.style.transition = "transform .25s var(--ease)"; sh.style.transform = ""; };
    sh.addEventListener("pointerdown", e => {
      settle();
      if (e.target.closest(".grab, .sh-head") && !e.target.closest("button") && sh.scrollTop <= 0) swipe = { id: e.pointerId, y: e.clientY };
    });
    sh.addEventListener("pointermove", e => {
      if (swipe?.id !== e.pointerId) return;
      const dy = Math.max(0, e.clientY - swipe.y);
      if (dy > 4) Object.assign(sh.style, { animation: "none", transition: "none", transform: `translateY(${dy}px)` });
    });
    sh.addEventListener("pointerup", e => {
      if (swipe?.id !== e.pointerId) return;
      if (e.clientY - swipe.y > 60) { swipe = null; return closeSheet(); }
      settle();
    });
    sh.addEventListener("pointercancel", settle);
  }
  // «где купить» для выбранной вещи: тот же подбор, что в «Мебели по размерам».
  // Пишем только последний запрос и только в лист той же вещи: ответы приходят вразнобой
  let shopsN = 0;
  async function loadShops(s) {
    const n = ++shopsN, box = () => stage.querySelector(".r3d-sheet [data-shops]");
    const mine = () => n === shopsN && open?.kind === "obj" && box() && (s.added ? open.sel?.type === "added" && open.sel.j === s.j : open.sel?.type === "obj" && open.sel.i === s.i);
    try {
      if (!shops) { await saved(); shops ||= api(`/scans/${x.id}/furniture`).then(r => r.items); }   // один запрос на всех ждущих
      const items = await shops, f = items.find(f => s.added ? f.added === s.j : f.index === s.i);
      if (!mine()) return;
      box().innerHTML = f ? furnItem(f, { bare: true }) : `<p class="muted" style="margin:0">Для этой вещи магазинов нет</p>`;
      wireShops(box());
      E.setInset(Math.min(stage.querySelector(".r3d-sheet").offsetHeight, stage.clientHeight * .56));
    } catch { shops = null; if (mine()) box().innerHTML = `<p class="muted" style="margin:0">Не загрузилось, проверьте интернет</p>`; }
  }
  function picked(s) {
    if (!s) return closeSheet();
    haptic();
    if (s.type === "obj" || s.type === "added") sheet("obj", s);
    else sheet(s.type, s);
  }

  // ---------- фото «как в жизни»: снимок 3D из комнаты → ИИ делает из него фотографию ----------
  async function real() {
    if (busy) return;
    if (E.lost) return toast("3D перезапускается, нажмите через пару секунд");   // иначе в фото уйдёт пустой кадр
    busy = true; closeSheet();
    const btn = $("[data-real]"); btn.disabled = true;
    if (E.mode !== "room") { await setMode("room"); await new Promise(r => setTimeout(r, 120)); }
    const shot = E.snapshot(1280), style = E.look.style, look = M.toContract(E.look);
    clearTimeout(saveT); saveT = 0;   // ремонт сохранится вместе с фото
    const wait = document.createElement("div");
    wait.className = "r3d-wait";
    const msgs = ["Беру точные размеры…", "Кладу настоящие материалы…", "Ставлю дневной свет…", `Стиль «${p.styles[style]}»…`, "Почти готово…"];
    wait.innerHTML = `<div class="scanning"><img alt="" src="${shot}"><div class="msg" data-msgs='${esc(JSON.stringify(msgs))}'>${msgs[0]}</div></div>`;
    stage.append(wait); rotateMsgs(wait);
    try {
      const r = await api(`/scans/${x.id}/render`, { method: "POST", body: { image: shot, style, look } });
      clearScreen(); notify("success");
      x.look = look; status.textContent = "Сохранено"; status.classList.add("ok");
      state.profile.credits = r.credits;
      if (!closed) result(r, shot);
    } catch (e) { clearScreen(); if (!closed) { save(); aiError(e); } }
    wait.remove(); btn.disabled = false; busy = false;
  }
  function result(r, shot) {
    const res = document.createElement("div");
    res.className = "r3d-res";
    res.innerHTML = `
      <header class="top"><div class="grow"><h1 class="title">Как в жизни</h1><div class="sub">${esc(r.style)}, по точным размерам комнаты</div></div>
        <button type="button" class="x" data-back aria-label="Назад к 3D">×</button></header>
      <div class="ba reveal"><img alt="Ремонт как в жизни, стиль ${esc(r.style)}" src="${esc(r.image)}">
        <div class="before"><img alt="3D-модель ремонта" src="${shot}"></div>
        <div class="handle"></div><span class="tag l">3D</span><span class="tag r">Как в жизни</span></div>
      <p class="muted" style="text-align:center;margin:0 0 12px">Двигайте жёлтую ручку, чтобы сравнить с 3D</p>
      <div class="actions"><button type="button" class="btn quiet" data-send>Отправить<small>в чат с ботом</small></button>
        <button type="button" class="btn quiet" data-est>Смета<small>${p.prices.estimate ? credits(p.prices.estimate) : "бесплатно"}</small></button></div>
      <button type="button" class="btn" data-back>Вернуться к 3D</button>
      <p class="balance">На балансе ${credits(r.credits)}</p>
      <div data-eout style="margin-top:12px"></div>`;
    el.append(res);
    const ba = res.querySelector(".ba");
    ba.addEventListener("animationend", () => { ba.classList.remove("reveal"); ba.style.setProperty("--x", "50%"); }, { once: true });
    wireBA(ba);
    res.querySelectorAll("[data-back]").forEach(b => b.onclick = () => res.remove());
    res.querySelector("[data-send]").onclick = async () => {
      try { await api("/send", { method: "POST", body: { photo: r.image, text: `${x.room}: ремонт «${r.style}» по 3D-скану` } }); notify("success"); toast("Отправил в чат с ботом"); }
      catch (err) { aiError(err); }
    };
    res.querySelector("[data-est]").onclick = async e => {
      const out = res.querySelector("[data-eout]"); e.target.disabled = true;
      out.innerHTML = drafting(["Считаю объёмы по скану…", "Беру отделку из 3D…", "Собираю смету…"]); rotateMsgs(out);
      out.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
      try {
        const q = await api(`/scans/${x.id}/estimate`, { method: "POST" });
        clearScreen(); notify("success"); state.profile.credits = q.credits;
        out.innerHTML = answerBlock(q.html, q.raw); wireAnswer(out, q.raw);
      } catch (err) { clearScreen(); out.innerHTML = ""; aiError(err); }
      e.target.disabled = false;
    };
  }

  // совет из «Мебели по размерам»: ставим сразу в нужное место
  if (add?.place) {
    const v = add.variant || "dresser", [, , h0] = M.sizeOf(add.kind, v);
    const r = E.add(add.kind, v, { ...add.place, height: Math.min(h0, add.place.height || h0) });
    if (r) { const s = { type: "added", j: r.j }; E.select(s); sheet("obj", s); toast(`${add.title} до ${add.max?.width || ""} см: двигайте пальцем`, 2600); }
  }
}

// ---------- строительный уровень ----------
function showLevel() {
  setBack(() => go("tools"));
  let mode = "flat", zero = { flat: [0, 0], edge: 0 }, last = null, okPrev = false;
  paint(`
    <header class="top"><div class="grow"><h1 class="title">Уровень</h1>
      <div class="sub">Положите телефон на поверхность или приложите ребром к стене</div></div></header>
    <div class="chips" role="group" aria-label="Режим"><button type="button" data-m="flat" aria-pressed="true">На поверхности</button><button type="button" data-m="edge" aria-pressed="false">Ребром</button></div>
    <div id="lv"></div>
    <div class="readout" id="rd"><div class="deg">—</div><div class="mm">Жду датчик наклона…</div></div>
    <div class="pair" style="margin-top:18px"><button class="btn quiet" id="lv-start">Включить датчик</button><button class="btn quiet" id="lv-zero">Обнулить</button></div>
    <p class="balance">Отклонение считается на двухметровое правило, как у строителей</p>`, () => {
    const $lv = document.getElementById("lv"), $rd = document.getElementById("rd");
    const draw = () => { $lv.innerHTML = mode === "flat" ? `<div class="vial-round"><div class="cross"></div><div class="bubble"></div></div>` : `<div class="vial-tube"><div class="bubble"></div></div>`; };
    draw();
    const upd = g => {
      last = g;
      const b = $lv.querySelector(".bubble");
      let a, dx = 0, dy = 0;
      if (mode === "flat") {
        const ax = deg(Math.atan2(g.x, Math.hypot(g.y, g.z))) - zero.flat[0], ay = deg(Math.atan2(g.y, Math.hypot(g.x, g.z))) - zero.flat[1];
        a = Math.hypot(ax, ay);
        const r = Math.min(1, a / 10), ang = Math.atan2(ay, ax);
        dx = -Math.cos(ang) * r * 120; dy = Math.sin(ang) * r * 120;
      } else {
        a = edgeTilt(g) - zero.edge;
        dx = Math.max(-1, Math.min(1, a / 8)) * 130;
        a = Math.abs(a);
      }
      b.style.transform = `translate(${dx.toFixed(1)}%, ${dy.toFixed(1)}%)`;
      const ok = a < .3;
      b.classList.toggle("ok", ok); $rd.classList.toggle("ok", ok);
      $rd.querySelector(".deg").textContent = a.toFixed(1).replace(".", ",") + "°";
      $rd.querySelector(".mm").textContent = ok ? "Ровно" : `${mmPer2m(a)} мм на 2 м`;
      if (ok && !okPrev) notify("success");
      okPrev = ok;
    };
    const start = async () => {
      const stop = await startMotion(upd);
      if (!stop) return toast("Разрешите доступ к датчикам движения");
      cleanups.push(stop);
      document.getElementById("lv-start").hidden = true;
      setTimeout(() => { if (!last) $rd.querySelector(".mm").textContent = "Датчик наклона не отвечает. Откройте приложение с телефона"; }, 2000);
    };
    document.getElementById("lv-start").onclick = start;
    // на Android датчик доступен сразу, на iPhone нужно нажатие
    if (!(typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function" && !(tg?.Accelerometer && tg.isVersionAtLeast?.("8.0")))) start();
    document.getElementById("lv-zero").onclick = () => {
      if (!last) return;
      if (mode === "flat") zero.flat = [deg(Math.atan2(last.x, Math.hypot(last.y, last.z))), deg(Math.atan2(last.y, Math.hypot(last.x, last.z)))];
      else zero.edge = edgeTilt(last);
      haptic("medium"); toast("Текущий наклон принят за ноль");
    };
    document.querySelectorAll(".chips [data-m]").forEach(b => b.onclick = () => {
      mode = b.dataset.m; haptic(); draw(); okPrev = false;
      document.querySelectorAll(".chips [data-m]").forEach(x => x.setAttribute("aria-pressed", x === b));
      if (last) upd(last);
    });
  });
}

// ---------- фотоотчёт ----------
async function showReport(oid) {
  setBack(() => oid ? go("obj/" + oid) : go("tools"));
  const [p, me] = await Promise.all([loadProfile(), state.me ? state.me : api("/me")]);
  state.me = me;
  const items = [];
  let target = oid || 0;
  paint(`
    <header class="top"><div class="grow"><h1 class="title">Фотоотчёт</h1>
      <div class="sub">Фото с подписями, короткое резюме для заказчика и PDF прямо в чат</div></div></header>
    ${me.objects.length ? `<div class="chips wrap" role="group" aria-label="Объект">
      <button type="button" data-o="0" aria-pressed="${!target}">Без объекта</button>
      ${me.objects.map(o => `<button type="button" data-o="${o.id}" aria-pressed="${o.id === target}">${esc(o.name)}</button>`).join("")}</div>` : ""}
    <section class="panel pad"><div class="thumbs" id="r-list"></div>
      <div class="pair" id="r-add" style="margin-top:4px"><button type="button" class="btn" data-cam>Снять</button><button type="button" class="btn quiet" data-gal>Из галереи</button></div></section>
    <label class="field"><span>Общий комментарий</span><div class="ta"><textarea id="r-notes" style="min-height:80px" maxlength="2000" placeholder="Что сделано за неделю, что дальше"></textarea>
      <button type="button" class="mic" aria-label="Надиктовать голосом">${MIC}</button></div></label>
    <button class="btn" id="r-go">Собрать PDF${costWord("report")}</button>
    <div id="r-out" style="margin-top:12px"></div>`, () => {
    const $list = document.getElementById("r-list");
    const draw = () => {
      $list.innerHTML = items.length ? items.map((it, i) => `<div class="thumb"><img alt="Фото ${i + 1}" src="${it.url}">
        <input data-i="${i}" placeholder="Подпись к фото ${i + 1}" value="${esc(it.caption)}" maxlength="300"><button class="x" data-del="${i}" aria-label="Убрать фото">×</button></div>`).join("")
        : `<p class="muted" style="margin:4px 0 12px">Добавьте до ${p.report_max_photos} фото. Подпись можно надиктовать</p>`;
      $list.querySelectorAll("input").forEach(inp => inp.oninput = () => { items[inp.dataset.i].caption = inp.value; });
      $list.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { items.splice(+b.dataset.del, 1); haptic(); draw(); });
    };
    draw();
    const add = async files => {
      for (const f of files.slice(0, p.report_max_photos - items.length)) {
        try { const blob = await toJpeg(f, 1400); items.push({ blob, url: URL.createObjectURL(blob), caption: "" }); } catch {}
      }
      haptic(); draw();
    };
    document.querySelector("#r-add [data-cam]").onclick = async () => { const f = await takePhoto("Держите горизонт по жёлтой линии"); if (f) add([f]); };
    document.querySelector("#r-add [data-gal]").onclick = async () => add(await pickFile({ multiple: true }));
    wireMic(document.querySelector(".ta .mic"), document.getElementById("r-notes"));
    document.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
      target = +b.dataset.o; haptic();
      document.querySelectorAll("[data-o]").forEach(x => x.setAttribute("aria-pressed", x === b));
    });
    document.getElementById("r-go").onclick = async e => {
      if (!items.length) { notify("error"); return toast("Добавьте хотя бы одно фото"); }
      const fd = new FormData();
      items.forEach((it, i) => { fd.append("photos", it.blob, `p${i + 1}.jpg`); fd.append("captions", it.caption); });
      fd.append("oid", target); fd.append("notes", document.getElementById("r-notes").value);
      const out = document.getElementById("r-out"); e.target.disabled = true;
      out.innerHTML = drafting(["Раскладываю фото…", "Пишу резюме для заказчика…", "Верстаю PDF…"]); rotateMsgs(out);
      out.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
      try {
        await api("/report", { method: "POST", body: fd });
        clearScreen(); notify("success");
        out.innerHTML = `<section class="panel pdf-done"><svg viewBox="0 0 110 120" aria-hidden="true"><path class="sheet" d="M14 6h58l24 24v84H14z"/>
          <path class="ok" d="M36 66l14 14 26-30"/></svg><strong class="display">PDF уже в чате</strong>
          <p class="muted" style="margin:0 0 8px">Перешлите его заказчику прямо из чата с ботом</p>
          <button class="btn" onclick="tg ? tg.close() : null">Перейти в чат</button></section>`;
        items.length = 0; draw();
      } catch (err) { clearScreen(); out.innerHTML = ""; aiError(err); }
      e.target.disabled = false;
    };
  });
}

// ---------- профиль: баланс, пополнение, друзья, роль ----------
async function showMe() {
  setBack(null);
  const p = await loadProfile(true);
  const best = Math.min(...p.packs.map(x => x.stars / x.credits));
  paint(`
    <header class="top"><div class="grow"><h1 class="title">Профиль</h1><div class="sub">Баланс, пополнение и приглашения</div></div></header>
    <section class="wallet">
      <svg class="coins" viewBox="0 0 130 110" aria-hidden="true">${[0, 1, 2, 3, 4].map(i => `<rect x="${30 + (i % 2) * 6}" y="${86 - i * 14}" width="70" height="12" rx="6" style="animation-delay:${i * 90}ms"/>`).join("")}</svg>
      <div style="opacity:.7;font-size:14px">На балансе</div>
      <div class="big" id="cr">0</div>
      <div style="opacity:.7;font-size:14px">${plural(p.credits, "кредит", "кредита", "кредитов")}. Дизайн по фото стоит ${p.prices.design}, смета ${p.prices.estimate}</div>
    </section>
    <h2 class="h2">Пополнить звёздами</h2>
    <section class="panel">${p.packs.map(x => `<div class="pack"><span class="n">${x.credits}</span>
      <div class="grow">${plural(x.credits, "кредит", "кредита", "кредитов")}<div class="muted">${x.stars / x.credits === best ? "самый выгодный" : `${Math.round(x.stars / x.credits)} ★ за кредит`}</div></div>
      <button data-pack="${x.id}">${x.stars} ★</button></div>`).join("")}</section>
    <h2 class="h2">Пригласить друга</h2>
    <section class="panel pad">
      <div>Когда друг впервые воспользуется платной функцией, вам придёт +${p.invite.bonus} ${plural(p.invite.bonus, "кредит", "кредита", "кредитов")}.</div>
      ${p.invite.link ? `<div class="linkbox">${esc(p.invite.link)}</div>
      <div class="pair"><button class="btn" id="inv-share">Поделиться</button><button class="btn quiet" id="inv-copy">Скопировать</button></div>` : ""}
      <p class="muted" style="margin:12px 0 0">Пригласили: ${p.invite.invited}, бонусов получено: ${p.invite.rewarded}</p>
    </section>
    <h2 class="h2">LiDAR-сканер</h2>
    <section class="panel pad"><div>Приложение СтройСкан на iPhone Pro меряет комнату лидаром и присылает размеры сюда и в чат.</div>
      <button class="btn quiet" style="margin-top:12px" onclick="pairIphone()">Подключить iPhone</button></section>
    <h2 class="h2">Кто вы</h2>
    <div class="chips wrap" role="group" aria-label="Роль">${Object.entries(p.roles).map(([k, v]) =>
      `<button type="button" data-role="${k}" aria-pressed="${p.role === k}">${esc(v.replace(/^\S+\s/, ""))}</button>`).join("")}</div>
    <p class="balance">Вопросы по оплате: команда /paysupport в чате бота</p>`, () => {
    const cr = document.getElementById("cr");
    if (reduced) cr.textContent = p.credits; else {
      const t0 = performance.now(), step = t => { const k = Math.min(1, (t - t0) / 900); cr.textContent = Math.round(p.credits * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    }
    document.querySelectorAll("[data-pack]").forEach(b => b.onclick = async () => {
      haptic("medium");
      try {
        const { link } = await api("/invoice", { method: "POST", body: { pack: b.dataset.pack } });
        if (tg?.openInvoice) tg.openInvoice(link, st => { if (st === "paid") { notify("success"); toast("Кредиты начислены"); setTimeout(() => hashPath() === "me" && showMe(), 800); } });
        else location.href = link;
      } catch (e) { aiError(e); }
    });
    const link = p.invite.link;
    document.getElementById("inv-share")?.addEventListener("click", () => {
      const u = `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent("СтройБот: дизайн по фото, сметы и учёт ремонта")}`;
      tg?.openTelegramLink ? tg.openTelegramLink(u) : open(u);
    });
    document.getElementById("inv-copy")?.addEventListener("click", async () => { try { await navigator.clipboard.writeText(link); toast("Ссылка скопирована"); } catch {} });
    document.querySelectorAll("[data-role]").forEach(b => b.onclick = async () => {
      await api("/profile/role", { method: "POST", body: { role: b.dataset.role } });
      state.profile.role = b.dataset.role; haptic();
      document.querySelectorAll("[data-role]").forEach(x => x.setAttribute("aria-pressed", x === b)); toast("Сохранено");
    });
  });
}

// нижняя панель
const DOCK = ["", "tools", "me"];
function dock(h) {
  const i = DOCK.indexOf(h);
  document.body.classList.toggle("docked", i >= 0);
  const d = document.getElementById("dock");
  if (i < 0 || !d) return;
  d.querySelector(".ind").style.transform = `translateX(${i * 100}%)`;
  d.querySelectorAll("button").forEach((b, j) => j === i ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
}

route();
</script>
