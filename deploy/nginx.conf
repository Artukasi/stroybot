# nginx: HTTPS-адрес для Mini App. Замените stroybot.example.ru на свой домен,
# получите сертификат: sudo certbot --nginx -d stroybot.example.ru
server {
    listen 80;
    server_name stroybot.example.ru;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
