# Проект Xcode собирается из этого файла программой XcodeGen (на GitHub это делается автоматически).
name: StroyScan
options:
  bundleIdPrefix: ru.stroybot
  deploymentTarget:
    iOS: "16.0"
targets:
  StroyScan:
    type: application
    platform: iOS
    sources: [Sources]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.stroybot.stroyscan
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: СтройСкан
        INFOPLIST_KEY_NSCameraUsageDescription: Камера и лидар нужны, чтобы измерить комнату.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Чтобы сохранить картинку ремонта в «Фото».
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Чтобы надиктовать заметку к стене голосом.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGNING_ALLOWED: NO
